name: Examples on Devnet

# Builds the SDK and runs every example in `examples/` against Devnet. The workflow needs no repository secret. Each run
# creates a throwaway account with `examples/faucetFunder.ts`, funds it with one request to the Devnet faucet, and runs
# the examples from that account: they fund the accounts they generate by transfers from it and request nothing from
# the faucet. `faucet.ts` skips its own faucet request because SUPRA_EXAMPLES_FUND is not set; the funding step makes
# the same SDK faucet call. The key of the throwaway account is masked in the log and written nowhere else.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The Devnet faucet limits requests per IP address, and runners share addresses. One run at a time keeps two runs from
# drawing on the faucet allowance of one IP address at once.
concurrency:
  group: examples-devnet
  cancel-in-progress: false

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPRA_NETWORK: devnet
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The funder prints only the private key on stdout; `::add-mask::` hides it in the log before anything else can
      # print it.
      - name: Fund an account and run the examples
        run: |
          set -euo pipefail
          key="$(pnpm exec tsx examples/faucetFunder.ts)"
          echo "::add-mask::$key"
          SUPRA_PRIVATE_KEY="$key" pnpm examples
